[tool.poetry]
name = "synapse"
version = "0.1.0"
description = "Synapse AI Learning Platform"
authors = ["Synapse Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Core Framework
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.28.0" }
pydantic = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
ruff = "^0.5.0"
black = "^24.4.0"
mypy = "^1.10.0"
pre-commit = "^3.7.0"

[tool.pytest.ini_options]
testpaths = [
    "gateway/tests",
    "services/*/tests"
]
python_files = [
    "test_*.py"
]
pythonpath = [
    "."
]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
