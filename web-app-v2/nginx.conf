server {
    listen 3000;
    server_name localhost;

    # Allow uploads up to 100 MB.
    # Default nginx limit is 1 MB — without this, any file > 1 MB returns 413 before
    # the request ever reaches the gateway or document-service.
    client_max_body_size 100m;

    # Increase body buffer to avoid temp-file spills for large uploads
    client_body_buffer_size 16k;

    # ── Static SPA assets ─────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ── SSE stream endpoint — must be handled BEFORE the generic /api/ block ──
    # Disables proxy buffering so SSE events are forwarded to the browser instantly.
    location /api/v1/workspaces/~*/documents/stream {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;

        # SSE-specific: disable buffering so events reach the browser in real-time
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long-lived connection timeouts for SSE (keepalive every 20s)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header X-Accel-Buffering no;
    }

    # ── API reverse proxy to FastAPI gateway ──────────────────────────────────
    location /api/ {
        proxy_pass http://gateway:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_cache_bypass $http_upgrade;

        # Extended timeouts for large file uploads (100 MB @ slow connection)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

